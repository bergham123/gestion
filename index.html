<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الإدارة - Gestion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      color: #333;
    }
    .container { max-width: 1400px; margin: auto; }
    /* رأس الصفحة */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
      background: #fff;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header h1 { font-size: 24px; color: #1a2b4a; }
    .header .badge { background: #eef2f7; padding: 5px 15px; border-radius: 20px; font-size: 14px; }

    /* شبكة الأعمدة */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 300px 1fr 250px;
      gap: 20px;
      margin-bottom: 25px;
    }
    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* بطاقات */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h3 {
      font-size: 16px;
      color: #4a5b6e;
      margin-bottom: 12px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 8px;
    }

    /* النموذج المتغير */
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3d4e62;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d9e6;
      border-radius: 8px;
      font-size: 14px;
      background: #fafcff;
    }
    .form-group select[multiple] {
      height: auto;
      min-height: 80px;
    }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background: #1a2b4a; color: #fff; }
    .btn-primary:hover { background: #2c3f62; }
    .btn-success { background: #1f8b4c; color: #fff; }
    .btn-success:hover { background: #1a7540; }
    .btn-danger { background: #c72a3c; color: #fff; }
    .btn-danger:hover { background: #b02434; }
    .btn-outline { background: transparent; border: 1px solid #bcc9db; }
    .btn-outline:hover { background: #edf2f7; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

    /* الفلاتر */
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
    }
    .filters .form-group { margin-bottom: 0; flex: 1; min-width: 120px; }

    /* الجدول */
    .table-wrapper {
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      padding: 10px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      background: #f0f4fa;
      color: #1f2e44;
      font-weight: 700;
      padding: 12px 12px;
      text-align: right;
      border-bottom: 2px solid #dce3ec;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e7ecf3;
    }
    tr:hover { background: #f8fafd; }
    .actions-cell {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .actions-cell .btn { font-size: 12px; padding: 4px 10px; }

    /* إحصائيات سريعة */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-item {
      background: #f6f9fe;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-item .num {
      font-size: 22px;
      font-weight: 700;
      color: #1a2b4a;
    }
    .stat-item .label {
      font-size: 12px;
      color: #5e7186;
    }

    /* رسائل */
    #message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
    #message.success { display: block; background: #e2f3e4; color: #0f5c33; border: 1px solid #b7dfb9; }
    #message.error { display: block; background: #fde8ea; color: #a11f2e; border: 1px solid #f9cdd0; }

    /* وضع الطباعة */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; padding: 10px; }
      .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
      .dashboard-grid { display: block; }
      .card { margin-bottom: 15px; }
      table { font-size: 12px; }
      th, td { padding: 6px 8px; }
      .btn { display: none; }
      .actions-cell .btn { display: none; }
      .header .badge { display: none; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- رأس الصفحة -->
  <div class="header no-print">
    <h1>📋 نظام الإدارة</h1>
    <div>
      <span class="badge">الإصدار 1.0</span>
      <button class="btn btn-primary" onclick="printPage()" style="margin-right:10px;">🖨️ طباعة / PDF</button>
    </div>
  </div>

  <!-- رسائل النظام -->
  <div id="message"></div>

  <!-- شبكة لوحة التحكم -->
  <div class="dashboard-grid">
    <!-- العمود 1: النموذج المتغير -->
    <div class="card no-print" id="formCard">
      <h3>📝 إدخال جديد</h3>
      <div class="form-group">
        <label for="dataType">نوع البيانات</label>
        <select id="dataType" onchange="updateForm()">
          <option value="in">سلع داخلة</option>
          <option value="out">سلع خارجة</option>
          <option value="attendance1">حضور - جروب 1</option>
          <option value="attendance2">حضور - جروب 2</option>
          <option value="hours">ساعات العمل</option>
          <option value="fuel">استهلاك البنزين</option>
          <option value="todos">قائمة المهام</option>
        </select>
      </div>

      <!-- حاوية الحقول المتغيرة -->
      <div id="dynamicFields"></div>

      <button class="btn btn-success" onclick="saveRecord()" style="width:100%;margin-top:10px;">💾 حفظ</button>
    </div>

    <!-- العمود 2: الفلاتر والبحث -->
    <div class="card no-print">
      <h3>🔍 فلتر & بحث</h3>
      <div class="filters">
        <div class="form-group">
          <label>من تاريخ</label>
          <input type="date" id="filterFrom">
        </div>
        <div class="form-group">
          <label>إلى تاريخ</label>
          <input type="date" id="filterTo">
        </div>
        <div class="form-group" style="min-width:100px;">
          <label>&nbsp;</label>
          <button class="btn btn-primary" onclick="fetchData()">بحث</button>
        </div>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="fetchData('today')">📅 اليوم</button>
        <button class="btn btn-outline" onclick="fetchData('month')">📆 هذا الشهر</button>
        <button class="btn btn-outline" onclick="fetchData('all')">📂 الكل</button>
      </div>
    </div>

    <!-- العمود 3: إحصائيات سريعة -->
    <div class="card no-print">
      <h3>📊 إحصائيات سريعة</h3>
      <div class="stats-grid" id="statsContainer">
        <div class="stat-item"><div class="num" id="statIn">0</div><div class="label">داخل اليوم</div></div>
        <div class="stat-item"><div class="num" id="statOut">0</div><div class="label">خارج اليوم</div></div>
        <div class="stat-item"><div class="num" id="statAttendance">0</div><div class="label">حاضرون اليوم</div></div>
        <div class="stat-item"><div class="num" id="statHours">0</div><div class="label">ساعات اليوم</div></div>
      </div>
    </div>
  </div>

  <!-- الجدول الرئيسي -->
  <div class="card">
    <h3 id="tableTitle">📋 آخر السجلات</h3>
    <div class="table-wrapper">
      <table>
        <thead id="tableHead"><tr><th>#</th><th>التاريخ</th><th>التفاصيل</th><th class="no-print">إجراءات</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="4" style="text-align:center;">لا توجد بيانات</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ---------- الإعدادات الأساسية ----------
  const WORKER_URL = 'https://gestion.velora.workers.dev/'; // استبدل برابط الـ Worker الخاص بك

  // دالة مساعدة للاتصال بالـ Worker
  async function callWorker(action, type, method = 'GET', body = null) {
    let url = `${WORKER_URL}?action=${action}&type=${type}`;
    const options = {
      method: method,
      headers: { 'Content-Type': 'application/json' }
    };
    if (body) options.body = JSON.stringify(body);
    const response = await fetch(url, options);
    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error || 'فشل الاتصال');
    }
    return await response.json();
  }

  // ---------- عرض الرسائل ----------
  function showMessage(text, type = 'success') {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = type;
    setTimeout(() => { msg.className = ''; msg.style.display = 'none'; }, 4000);
  }

  // ---------- تحديث النموذج حسب النوع ----------
  function updateForm() {
    const type = document.getElementById('dataType').value;
    const container = document.getElementById('dynamicFields');
    let html = '';

    // الحقول المشتركة: التاريخ
    const today = new Date().toISOString().split('T')[0];
    html += `<div class="form-group"><label>التاريخ</label><input type="date" id="field_date" value="${today}"></div>`;

    switch (type) {
      case 'in':
        html += `
          <div class="form-group"><label>نوع السلع</label><input id="field_item" placeholder="مثل: اسمنت"></div>
          <div class="form-group"><label>الكمية</label><input id="field_qty" type="number" placeholder="0"></div>
          <div class="form-group"><label>اسم المورد</label><input id="field_supplier" placeholder="المورد"></div>
          <div class="form-group"><label>رقم اللوحة</label><input id="field_plate" placeholder="لوحة السيارة"></div>
          <div class="form-group"><label>ملاحظات</label><textarea id="field_notes" rows="2"></textarea></div>
        `;
        break;

      case 'out':
        html += `
          <div class="form-group"><label>نوع السلع</label><input id="field_item" placeholder="مثل: اسمنت"></div>
          <div class="form-group"><label>الكمية</label><input id="field_qty" type="number" placeholder="0"></div>
          <div class="form-group"><label>اسم المستلم</label><input id="field_receiver" placeholder="المستلم"></div>
          <div class="form-group"><label>ملاحظات</label><textarea id="field_notes" rows="2"></textarea></div>
        `;
        break;

      case 'attendance1':
      case 'attendance2':
        const groupName = type === 'attendance1' ? 'جروب 1' : 'جروب 2';
        // قائمة بأسماء افتراضية (يمكن تعديلها)
        const defaultNames = ['أحمد', 'محمد', 'سعيد', 'خالد', 'علي', 'حسن', 'مصطفى'];
        html += `
          <div class="form-group"><label>اختر الحاضرين (متعدد)</label>
            <select id="field_names" multiple>
              ${defaultNames.map(n => `<option value="${n}">${n}</option>`).join('')}
            </select>
            <small>اضغط Ctrl (أو Cmd) للاختيار المتعدد</small>
          </div>
          <div class="form-group"><label>الحالة</label>
            <select id="field_status">
              <option value="حاضر">حاضر</option>
              <option value="غائب">غائب</option>
            </select>
          </div>
          <div class="form-group"><label>ملاحظات</label><input id="field_notes" placeholder="اختياري"></div>
          <input type="hidden" id="field_group" value="${groupName}">
        `;
        break;

      case 'hours':
        html += `
          <div class="form-group"><label>اسم الشخص</label><input id="field_person" placeholder="اسم الموظف"></div>
          <div class="form-group"><label>عدد الساعات</label><input id="field_hours" type="number" step="0.5" placeholder="مثل 1.5"></div>
          <div class="form-group"><label>ملاحظات</label><input id="field_notes" placeholder="اختياري"></div>
        `;
        break;

      case 'fuel':
        html += `
          <div class="form-group"><label>الكمية (لتر)</label><input id="field_liters" type="number" step="0.1" placeholder="0"></div>
          <div class="form-group"><label>السعر لكل لتر</label><input id="field_price" type="number" step="0.1" placeholder="0"></div>
          <div class="form-group"><label>اسم السائق</label><input id="field_driver" placeholder="السائق"></div>
          <div class="form-group"><label>قراءة العداد</label><input id="field_meter" type="number" placeholder="0"></div>
          <div class="form-group"><label>ملاحظات</label><input id="field_notes" placeholder="اختياري"></div>
        `;
        break;

      case 'todos':
        html += `
          <div class="form-group"><label>عنوان المهمة</label><input id="field_task" placeholder="مهمة جديدة"></div>
          <div class="form-group"><label>تاريخ الاستحقاق</label><input type="date" id="field_due" value="${today}"></div>
          <div class="form-group"><label>الأولوية</label>
            <select id="field_priority">
              <option value="عالية">عالية</option>
              <option value="متوسطة" selected>متوسطة</option>
              <option value="منخفضة">منخفضة</option>
            </select>
          </div>
          <div class="form-group"><label>ملاحظات</label><input id="field_notes" placeholder="اختياري"></div>
        `;
        break;
    }

    container.innerHTML = html;
    // إعادة تعيين رسالة الخطأ
    document.getElementById('message').className = '';
  }

  // استدعاء أولي لتجهيز النموذج
  updateForm();

  // ---------- حفظ السجل ----------
  async function saveRecord() {
    const type = document.getElementById('dataType').value;
    const record = { date: document.getElementById('field_date').value };

    // جمع البيانات حسب النوع
    const fields = document.querySelectorAll('#dynamicFields input, #dynamicFields select, #dynamicFields textarea');
    fields.forEach(el => {
      if (el.id && el.id.startsWith('field_')) {
        const key = el.id.replace('field_', '');
        if (el.type === 'select-multiple') {
          // للاختيار المتعدد (الحضور)
          const selected = Array.from(el.selectedOptions).map(opt => opt.value);
          record[key] = selected;
        } else {
          record[key] = el.value;
        }
      }
    });

    // معالجة خاصة للحضور: إذا كان select-multiple، سنحول كل اسم إلى سجل منفصل
    if (type.startsWith('attendance')) {
      const names = record.names || [];
      delete record.names; // نزيل الحقل الأصلي
      const status = record.status || 'حاضر';
      const group = document.getElementById('field_group')?.value || 'جروب 1';
      const notes = record.notes || '';

      // لكل اسم ننشئ سجل مستقل
      for (const name of names) {
        const singleRecord = {
          date: record.date,
          name: name,
          group: group,
          status: status,
          notes: notes
        };
        await callWorker('add', type, 'POST', { record: singleRecord });
      }
      showMessage(`تم تسجيل ${names.length} شخص بنجاح`, 'success');
      fetchData();
      return;
    }

    // باقي الأنواع: حفظ مباشر
    try {
      await callWorker('add', type, 'POST', { record });
      showMessage('تم الحفظ بنجاح ✅', 'success');
      fetchData();
      // تفريغ الحقول (اختياري)
      // ...
    } catch (e) {
      showMessage('خطأ: ' + e.message, 'error');
    }
  }

  // ---------- جلب البيانات وعرضها ----------
  let currentData = [];
  let currentType = 'in';

  async function fetchData(filter = 'all') {
    const type = document.getElementById('dataType').value;
    currentType = type;

    try {
      const data = await callWorker('get', type);
      currentData = data;

      // تطبيق الفلتر
      let filtered = [...data];
      const from = document.getElementById('filterFrom').value;
      const to = document.getElementById('filterTo').value;

      if (filter === 'today') {
        const today = new Date().toISOString().split('T')[0];
        filtered = data.filter(r => r.date === today);
      } else if (filter === 'month') {
        const now = new Date();
        const month = now.getMonth();
        const year = now.getFullYear();
        filtered = data.filter(r => {
          const d = new Date(r.date);
          return d.getMonth() === month && d.getFullYear() === year;
        });
      } else {
        if (from) filtered = filtered.filter(r => r.date >= from);
        if (to) filtered = filtered.filter(r => r.date <= to);
      }

      renderTable(filtered, type);
      updateStats(filtered, type);
    } catch (e) {
      showMessage('خطأ في جلب البيانات: ' + e.message, 'error');
    }
  }

  // ---------- عرض الجدول ----------
  function renderTable(data, type) {
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    // تحديد الأعمدة حسب النوع
    let columns = [];
    const common = ['id', 'date'];
    switch (type) {
      case 'in': columns = [...common, 'item', 'qty', 'supplier', 'plate', 'notes']; break;
      case 'out': columns = [...common, 'item', 'qty', 'receiver', 'notes']; break;
      case 'attendance1':
      case 'attendance2': columns = [...common, 'name', 'group', 'status', 'notes']; break;
      case 'hours': columns = [...common, 'person', 'hours', 'notes']; break;
      case 'fuel': columns = [...common, 'liters', 'price', 'driver', 'meter', 'notes']; break;
      case 'todos': columns = [...common, 'task', 'due', 'priority', 'notes']; break;
      default: columns = ['id', 'date', 'details'];
    }

    // عناوين الأعمدة
    const headerMap = {
      id: '#', date: 'التاريخ', item: 'السلعة', qty: 'الكمية', supplier: 'المورد',
      plate: 'اللوحة', receiver: 'المستلم', name: 'الاسم', group: 'الجروب',
      status: 'الحالة', person: 'الموظف', hours: 'الساعات', liters: 'لتر',
      price: 'السعر', driver: 'السائق', meter: 'العداد', task: 'المهمة',
      due: 'استحقاق', priority: 'الأولوية', notes: 'ملاحظات', details: 'التفاصيل'
    };

    let headerHtml = '<tr>';
    columns.forEach(col => {
      headerHtml += `<th>${headerMap[col] || col}</th>`;
    });
    headerHtml += `<th class="no-print">إجراءات</th></tr>`;
    thead.innerHTML = headerHtml;

    // الصفوف
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${columns.length+1}" style="text-align:center;">لا توجد سجلات</td></tr>`;
      return;
    }

    let bodyHtml = '';
    data.forEach((record, index) => {
      bodyHtml += '<tr>';
      columns.forEach(col => {
        let val = record[col] ?? '-';
        if (typeof val === 'object') val = JSON.stringify(val);
        bodyHtml += `<td>${val}</td>`;
      });
      // أزرار الإجراءات
      bodyHtml += `<td class="no-print actions-cell">
        <button class="btn btn-outline" onclick="editRecord('${type}', ${record.id})">✏️</button>
        <button class="btn btn-danger" onclick="deleteRecord('${type}', ${record.id})">🗑️</button>
      </td>`;
      bodyHtml += '</tr>';
    });
    tbody.innerHTML = bodyHtml;
  }

  // ---------- تحديث الإحصائيات ----------
  function updateStats(data, type) {
    // إحصائيات بسيطة
    const today = new Date().toISOString().split('T')[0];
    const todayData = data.filter(r => r.date === today);

    document.getElementById('statIn').textContent = type === 'in' ? todayData.length : '0';
    document.getElementById('statOut').textContent = type === 'out' ? todayData.length : '0';
    document.getElementById('statAttendance').textContent = type.startsWith('attendance') ? todayData.filter(r => r.status === 'حاضر').length : '0';

    let totalHours = 0;
    if (type === 'hours') {
      todayData.forEach(r => totalHours += parseFloat(r.hours) || 0);
    }
    document.getElementById('statHours').textContent = totalHours.toFixed(1);
  }

  // ---------- حذف سجل ----------
  async function deleteRecord(type, id) {
    if (!confirm('هل أنت متأكد من الحذف؟')) return;
    try {
      await callWorker('delete', type, 'DELETE', { id });
      showMessage('تم الحذف بنجاح', 'success');
      fetchData();
    } catch (e) {
      showMessage('خطأ: ' + e.message, 'error');
    }
  }

  // ---------- تعديل سجل (نسخة مبسطة) ----------
  async function editRecord(type, id) {
    // نبحث عن السجل في currentData
    const record = currentData.find(r => r.id === id);
    if (!record) {
      showMessage('السجل غير موجود', 'error');
      return;
    }

    // نملأ النموذج بالبيانات الحالية
    // (هنا نكتفي بتعبئة الحقول المعروفة)
    const fields = document.querySelectorAll('#dynamicFields input, #dynamicFields select, #dynamicFields textarea');
    fields.forEach(el => {
      const key = el.id.replace('field_', '');
      if (record[key] !== undefined) {
        if (el.type === 'select-multiple') {
          // للاختيار المتعدد
          const values = Array.isArray(record[key]) ? record[key] : [record[key]];
          Array.from(el.options).forEach(opt => {
            opt.selected = values.includes(opt.value);
          });
        } else {
          el.value = record[key];
        }
      }
    });

    // تغيير زر الحفظ ليصبح تحديث
    const saveBtn = document.querySelector('#formCard .btn-success');
    saveBtn.textContent = '🔄 تحديث';
    saveBtn.onclick = async function() {
      // جمع البيانات كسجل محدث
      const updatedRecord = { date: document.getElementById('field_date').value };
      fields.forEach(el => {
        if (el.id && el.id.startsWith('field_')) {
          const key = el.id.replace('field_', '');
          if (el.type === 'select-multiple') {
            updatedRecord[key] = Array.from(el.selectedOptions).map(opt => opt.value);
          } else {
            updatedRecord[key] = el.value;
          }
        }
      });

      try {
        await callWorker('update', type, 'PUT', { id, data: updatedRecord });
        showMessage('تم التحديث ✅', 'success');
        // إعادة زر الحفظ إلى وضعه الطبيعي
        saveBtn.textContent = '💾 حفظ';
        saveBtn.onclick = saveRecord;
        fetchData();
      } catch (e) {
        showMessage('خطأ: ' + e.message, 'error');
      }
    };

    // تمرير إلى أعلى النموذج
    document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
  }

  // ---------- طباعة ----------
  function printPage() {
    window.print();
  }

  // تحميل أولي عند فتح الصفحة
  document.addEventListener('DOMContentLoaded', () => {
    // ضبط الفلتر لليوم تلقائياً
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('filterFrom').value = today;
    document.getElementById('filterTo').value = today;
    fetchData('today');
  });
</script>
</body>
</html>
